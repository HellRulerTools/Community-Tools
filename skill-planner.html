<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hellruler skill planner</title>
<style>
  :root {
    --soot: #1b1512; --panel: #241c18; --panel2: #2d231e; --line: #3d302a;
    --bone: #efe3cf; --text: #e9dfd2; --muted: #a8978a; --ember: #e8a33d; --warn: #e0674f; --ok: #5c9a55;
    --str: #b8473b; --dex: #5c9a55; --int: #4c7cc0;
    --serif: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    --sans: "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--soot); color: var(--text); font: 14px/1.45 var(--sans);
    display: grid; grid-template-columns: 1fr 420px; grid-template-rows: 100%; overflow: hidden; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--ember); outline-offset: 1px; }

  /* ---- left: rune library ---- */
  #lib { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  #lib header { padding: 14px 20px 10px; border-bottom: 1px solid var(--line); }
  h1 { font: 600 20px var(--serif); margin: 0 0 2px; color: var(--bone); }
  .sub { color: var(--muted); font-size: 12px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--soot); }
  .bar input, .bar select { background: var(--soot); color: var(--text); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; font: 14px var(--sans); }
  .bar input[type=search] { flex: 1; min-width: 180px; }
  .tablewrap { overflow: auto; flex: 1; min-height: 0; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); padding: 6px 8px 6px 20px; position: sticky; top: 0; background: var(--soot); z-index: 1; }
  td { border-bottom: 1px solid #2c221d; padding: 6px 8px; vertical-align: top; }
  td:first-child { padding-left: 20px; }
  td.n { font: 600 14px var(--serif); color: var(--bone); white-space: nowrap; }
  td.t { color: var(--muted); font-size: 12px; }
  tr.act { cursor: pointer; }
  tr.act:hover td { background: #2a201b; }
  .pill { display: inline-block; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 10px; padding: 0 7px; margin-left: 6px; vertical-align: 1px; }
  .kindtag { font-size: 11px; text-transform: capitalize; }
  .kindtag.attack { color: var(--str); } .kindtag.spell { color: var(--int); }
  .kindtag.aura { color: var(--ember); } .kindtag.curse { color: #9b5fa8; } .kindtag.meta { color: var(--dex); } .kindtag.support { color: var(--muted); }
  .add { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 3px; padding: 3px 9px; font: 12px var(--sans); cursor: pointer; white-space: nowrap; }
  .add:hover { border-color: var(--ember); color: var(--bone); }

  /* ---- right: the loadout (pretend equip) ---- */
  aside { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); }
  .panebody { padding: 12px 16px 24px; overflow-y: auto; flex: 1; min-height: 0; }
  .hint { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
  .group { border: 1px solid var(--line); border-radius: 6px; margin-bottom: 14px; background: var(--panel2); }
  .group > .top { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); }
  .group .gi { width: 34px; height: 34px; border-radius: 6px; border: 1px solid var(--line); background: var(--soot); display: grid; place-items: center; font: 600 15px var(--serif); color: var(--muted); flex: none; }
  .group.filled .gi { color: var(--bone); border-color: var(--ember); }
  .group .gm { flex: 1; min-width: 0; }
  .group .gm .gn { font: 600 15px var(--serif); color: var(--bone); }
  .group .gm .gd { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .group .gm .empty { color: var(--muted); font-style: italic; }
  .group .x { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; padding: 2px 4px; }
  .group .x:hover { color: var(--warn); }
  .sockets { display: flex; gap: 6px; padding: 10px; flex-wrap: wrap; }
  .socket { flex: 1 1 calc(20% - 6px); min-width: 64px; min-height: 52px; border: 1px dashed var(--line); border-radius: 5px; padding: 5px 6px; font-size: 11px; display: flex; flex-direction: column; justify-content: center; position: relative; }
  .socket.full { border-style: solid; border-color: #4a3b30; background: var(--soot); cursor: default; }
  .socket.full .sn { color: var(--bone); font: 600 12px var(--sans); line-height: 1.2; }
  .socket.full .sx { position: absolute; top: 2px; right: 4px; color: var(--muted); cursor: pointer; }
  .socket.full .sx:hover { color: var(--warn); }
  .socket.empty { color: var(--muted); text-align: center; align-items: center; }
  .socket.meta { border-color: #3a5a38; }
  .reason { color: var(--muted); font-size: 11px; padding: 0 10px 10px; }
  .reason b { color: var(--text); }
  .addgroup { width: 100%; background: var(--panel2); border: 1px dashed var(--line); border-radius: 6px; color: var(--muted); padding: 10px; font: 600 13px var(--sans); cursor: pointer; }
  .addgroup:hover { border-color: var(--ember); color: var(--bone); }

  /* ---- picker modal ---- */
  #picker { position: fixed; inset: 0; background: rgba(10,7,6,0.72); display: none; z-index: 20; align-items: center; justify-content: center; }
  #picker.on { display: flex; }
  .pick { width: min(560px, 92vw); max-height: 80vh; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
  .pick .ph { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .pick .ph b { font: 600 16px var(--serif); color: var(--bone); }
  .pick .ph input { flex: 1; background: var(--soot); color: var(--text); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; font: 14px var(--sans); }
  .pick .ph .close { background: none; border: 0; color: var(--muted); font-size: 20px; cursor: pointer; }
  .pick .plist { overflow: auto; padding: 6px; }
  .pick .row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 4px; cursor: pointer; }
  .pick .row:hover { background: var(--panel2); }
  .pick .row.no { opacity: 0.4; cursor: not-allowed; }
  .pick .row .rn { font: 600 14px var(--serif); color: var(--bone); flex: none; }
  .pick .row .rd { color: var(--muted); font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pick .row .why { color: var(--warn); font-size: 11px; flex: none; }

  @media (max-width: 920px) { body { grid-template-columns: 1fr; grid-template-rows: 48% 52%; } aside { border-left: 0; border-top: 1px solid var(--line); } .socket { flex-basis: calc(33% - 6px); } }
</style>
</head>
<body>

<section id="lib">
  <header>
    <h1>Hellruler skill planner</h1>
    <div class="sub" id="libsub"></div>
  </header>
  <div class="bar">
    <input type="search" id="q" placeholder="Search name, tag or text" aria-label="Search runes">
    <select id="kind" aria-label="Kind">
      <option value="all">Every kind</option>
      <option value="attack">Attacks</option><option value="spell">Spells</option>
      <option value="aura">Auras</option><option value="curse">Curses</option>
      <option value="meta">Meta</option><option value="support">Supports</option>
    </select>
    <select id="attr" aria-label="Attribute"><option value="all">Any attribute</option><option value="str">Strength</option><option value="dex">Dexterity</option><option value="int">Intelligence</option></select>
  </div>
  <div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
</section>

<aside>
  <header>
    <h1>Your loadout</h1>
    <div class="sub">Socket an active rune into a group, then add supports. Only compatible runes are offered — like the game.</div>
  </header>
  <div class="panebody">
    <p class="hint" id="loadhint"></p>
    <div id="groups"></div>
    <button class="addgroup" id="addgroup">+ Add a skill group</button>
  </div>
</aside>

<div id="picker" role="dialog" aria-modal="true" aria-label="Pick a rune">
  <div class="pick">
    <div class="ph"><b id="picktitle">Pick</b><input type="search" id="pickq" placeholder="Filter" aria-label="Filter runes"><button class="close" id="pickclose" aria-label="Close">×</button></div>
    <div class="plist" id="plist"></div>
  </div>
</div>

s":["aoe","fire","herald","duration"],"reserve":25,"level":12,"desc":"Gain 12% of physical damage as extra fire. Enemies you kill burst into flame: 25% of their life as fire to everything within 1.8 tiles","mods":{"physAsFire":12,"heraldAsh":25},"text":["Gain 12% of Physical Damage as extra Fire","Enemies you kill burst for 25% of their Life as Fire"]},{"id":"rime_banner","name":"Rime Banner","tags":["aoe","cold","herald"],"reserve":25,"level":12,"desc":"Gain 12% of physical damage as extra cold. Chilled enemies you kill shatter: a cold blow of your own at half a spell's strength, never less than 20% of their life, around them, chilling — and what a shatter kills shatters in turn","mods":{"physAsCold":12,"heraldIce":20},"text":["Gain 12% of Physical Damage as extra Cold","Chilled enemies you kill shatter for 20% of their Life as Cold"]},{"id":"storm_banner","name":"Storm Banner","tags":["aoe","duration","lightning","herald"],"reserve":25,"level":12,"desc":"Gain 12% of physical damage as extra lightning. A kill calls three lightning bolts onto enemies near you","mods":{"physAsLight":12,"heraldThunder":3},"text":["Gain 12% of Physical Damage as extra Lightning","A kill calls 3 lightning bolts onto enemies near you"]},{"id":"coldheart","name":"Coldheart","tags":["aoe","cold"],"reserve":50,"level":24,"desc":"Gain 25% of physical damage as extra cold; 18% more cold damage","mods":{"physAsCold":25,"moreCold":18},"text":["Gain 25% of Physical Damage as extra Cold","18% more Cold Damage"]},{"id":"hotblood","name":"Hotblood","tags":["aoe","fire"],"reserve":50,"level":24,"desc":"Gain 15% of physical as extra fire; 20% more fire damage","mods":{"physAsFire":15,"moreFire":20},"text":["Gain 15% of Physical Damage as extra Fire","20% more Fire Damage"]},{"id":"stormheart","name":"Stormheart","tags":["aoe","lightning"],"reserve":50,"level":24,"desc":"Gain 15% of physical as extra lightning; 20% more lightning damage","mods":{"physAsLight":15,"moreLight":20},"text":["Gain 15% of Physical Damage as extra Lightning","20% more Lightning Damage"]},{"id":"ironheart","name":"Ironheart","tags":["aoe","physical"],"reserve":50,"level":24,"desc":"50% more armour","mods":{"armorPct":50},"text":["50% increased Armour"]},{"id":"sidestep","name":"Sidestep","tags":["aoe"],"reserve":50,"level":24,"desc":"+12% dodge","mods":{"dodge":12},"text":["+12% chance to Dodge"]},{"id":"wardsong","name":"Wardsong","tags":["aoe"],"reserve":35,"level":24,"desc":"+30% maximum barrier, barrier recharges 25% faster","mods":{"barrierPct":30,"barrierRechargePct":25},"text":["30% increased maximum Barrier","25% increased Barrier Recharge Rate"]},{"id":"lifespring","name":"Lifespring","tags":["aoe"],"reserve":35,"level":10,"desc":"+1.6% life regenerated per second","mods":{"regenPct":1.6},"text":["Regenerate 1.6% of maximum Life per second"]},{"id":"trueaim","name":"Trueaim","tags":["critical","aoe"],"reserve":20,"level":10,"desc":"58% increased critical strike chance","mods":{"critChancePct":58},"text":["58% increased Critical Chance"]},{"id":"quick_pulse","name":"Quick Pulse","tags":["aoe"],"reserve":50,"level":24,"desc":"+16% attack and cast speed, +10% movement speed","mods":{"attackSpeed":16,"castSpeed":16,"moveSpeed":10},"text":["16% increased Attack Speed","16% increased Cast Speed","10% increased Movement Speed"]},{"id":"calm_mind","name":"Calm Mind","tags":["aoe"],"reserve":25,"level":10,"desc":"Regenerate mana every second by the rune's level: 2.9 at level 1, 9 at 10, 33 at 20, 49 at 28","mods":{"manaRegenFlat":33},"text":["Regenerate 33 Mana per second"]},{"id":"slow_ruin","name":"Slow Ruin","tags":["aoe"],"reserve":50,"level":24,"desc":"20% more damage over time, +15% ailment duration","mods":{"dotMorePct":20,"dotDuration":15},"text":["20% more Damage over Time","15% increased ailment duration"]},{"id":"zeal","name":"Zeal","tags":["critical","aoe"],"reserve":50,"level":24,"desc":"10% more spell damage, 48% increased spell critical chance","mods":{"moreSpell":10,"critSpellPct":48},"text":["10% more Spell Damage","48% increased Critical Chance for spells"]},{"id":"overbearing","name":"Overbearing","tags":["aoe","physical"],"reserve":50,"level":24,"desc":"Nearby enemies take 20% more physical damage","mods":{"enemyPhysTaken":20},"text":["Enemies take 20% more Physical Damage from your hits"]},{"id":"warded_blood","name":"Warded Blood","tags":["aoe"],"reserve":35,"level":24,"desc":"+20% to all elemental resistances","mods":{"fireRes":20,"coldRes":20,"lightRes":20},"text":["+20% Fire Resistance","+20% Cold Resistance","+20% Lightning Resistance"]},{"id":"fire_ward","name":"Fire Ward","tags":["aoe","fire"],"reserve":35,"level":24,"desc":"+41% fire resistance, and +2% to its ceiling","mods":{"fireRes":41,"maxRes":2},"text":["+41% Fire Resistance","+2% maximum Resistances"]},{"id":"frost_ward","name":"Frost Ward","tags":["aoe","cold"],"reserve":35,"level":24,"desc":"+41% cold resistance, and +2% to its ceiling","mods":{"coldRes":41,"maxRes":2},"text":["+41% Cold Resistance","+2% maximum Resistances"]},{"id":"lightning_ward","name":"Lightning Ward","tags":["aoe","lightning"],"reserve":35,"level":24,"desc":"+41% lightning resistance, and +2% to its ceiling","mods":{"lightRes":41,"maxRes":2},"text":["+41% Lightning Resistance","+2% maximum Resistances"]},{"id":"sand_stance","name":"Sand Stance","tags":["aoe","stance","physical"],"reserve":25,"level":16,"desc":"Nearby enemies take 15% more physical damage; 20% more armour","mods":{"enemyPhysTaken":15,"armorPct":20},"text":["Enemies take 15% more Physical Damage from your hits","20% increased Armour"]},{"id":"battle_standard","name":"Battle Standard","tags":["aoe","duration","physical","banner"],"reserve":20,"level":4,"desc":"Nearby enemies take 10% more physical damage; you hit 15% more accurately","mods":{"enemyPhysTaken":10,"accuracyPct":15},"text":["Enemies take 10% more Physical Damage from your hits","15% increased Accuracy (enemies evade you less)"]},{"id":"fear_standard","name":"Fear Standard","tags":["aoe","duration","banner"],"reserve":20,"level":24,"desc":"Impales bite deeper (+25% effect) and enemies near you deal 8% less damage","mods":{"impaleEffect":25,"lessDamageTaken":8},"text":["25% increased Impale effect","8% less damage taken"]},{"id":"iron_standard","name":"Iron Standard","tags":["aoe","duration","banner"],"reserve":20,"level":16,"desc":"+20% armour and +6% block while it stands","mods":{"armorPct":20,"block":6},"text":["20% increased Armour","+6% chance to Block"]},{"id":"light_banner","name":"Light Banner","tags":["herald","minion","duration","physical"],"reserve":25,"level":16,"desc":"12% more physical damage, and your kills raise Light Sentinels to fight beside you, up to 4","mods":{"morePhys":12},"summons":{"gem":"light_sentinel","max":4},"text":["12% more Physical Damage"]},{"id":"venom_banner","name":"Venom Banner","tags":["herald","minion","chaos","physical"],"reserve":25,"level":16,"desc":"+20% chance to poison and 10% more poison damage; your kills raise a Venom Crawler, one at a time","mods":{"poisonChance":20,"morePoison":10},"summons":{"gem":"venom_crawler","max":1},"text":["+20% chance to Poison","10% more Poison Damage"]},{"id":"summon_sparkmites","name":"Summon Sparkmites","tags":["trap","mine","minion","cold","lightning","aoe"],"reserve":35,"level":16,"desc":"Two sparkmites run with you, chilling and shocking what they touch; +19% chill and shock effect","mods":{"shockEffect":19,"chillEffect":19},"summons":{"gem":"sparkmite","max":2},"text":["19% increased effect of Shock you inflict","19% increased effect of Chill you inflict"]}],"curses":[{"id":"kindled","name":"Kindled","tags":["aoe","duration","fire"],"level":24,"desc":"−30% fire resistance","effect":{"res":"fire","resAmt":30}},{"id":"frost_hex","name":"Frost Hex","tags":["aoe","duration","cold"],"level":24,"desc":"−30% cold resistance","effect":{"res":"cold","resAmt":30}},{"id":"grounded","name":"Grounded","tags":["aoe","duration","lightning"],"level":24,"desc":"−30% lightning resistance","effect":{"res":"lightning","resAmt":30}},{"id":"laid_bare","name":"Laid Bare","tags":["aoe","duration"],"level":24,"desc":"−20% to all elemental resistances","effect":{"res":"all","resAmt":20}},{"id":"flayed","name":"Flayed","tags":["aoe","duration","physical"],"level":24,"desc":"+20% physical damage taken, +20% damage over time taken","effect":{"physTaken":20,"dotTaken":20}},{"id":"soulrot","name":"Soulrot","tags":["aoe","duration","chaos"],"level":24,"desc":"−20% chaos resistance, +15% damage over time taken","effect":{"res":"chaos","resAmt":20,"dotTaken":15}},{"id":"weaken","name":"Weaken","tags":["aoe","duration"],"level":24,"desc":"Enemies deal 20% less damage","effect":{"lessDmg":20}},{"id":"slow_hours","name":"Slow Hours","tags":["aoe","duration"],"level":24,"desc":"Enemies act 20% slower; ailments on them last 25% longer","effect":{"slow":20}},{"id":"killers_mark","name":"Killer's Mark","tags":["critical","mark"],"level":16,"desc":"The marked enemy takes critical strikes: +1.5% to the chance and +50% multiplier against it, and a Power Charge when it falls","effect":{"critAgainst":1.5,"critMultiAgainst":50,"chargeOnKill":"power"},"mark":true},{"id":"butchers_mark","name":"Butcher's Mark","tags":["mark"],"level":16,"desc":"Hits on the marked enemy leech 3% of the damage as life, and it leaves an Endurance Charge when it falls","effect":{"leechFrom":3,"chargeOnKill":"endurance"},"mark":true},{"id":"hunters_mark","name":"Hunter's Mark","tags":["physical","mark"],"level":16,"desc":"The marked enemy takes 25% more damage and leaves a Frenzy Charge when it falls","effect":{"taken":25,"chargeOnKill":"frenzy"},"mark":true},{"id":"marksmans_mark","name":"Marksman's Mark","tags":["mark"],"level":4,"desc":"The marked enemy takes 40% increased damage from projectiles","effect":{"projTaken":40},"mark":true},{"id":"brewers_mark","name":"Brewer's Mark","tags":["mark","aoe","duration","fire","chaos"],"level":24,"desc":"Everything rotting or burning on the marked enemy bites 35% harder","effect":{"dotTaken":35},"mark":true},{"id":"doomed","name":"Doomed","tags":["aoe","duration"],"level":24,"desc":"Cursed enemies take 58% increased damage once they are under a third of their life","effect":{"lowLifeTaken":58}}],"other":[]}};</script>
<script>
(() => {
'use strict';
const D = window.HR_SKILLS;
if (!D) { document.body.textContent = 'Skill data not loaded.'; return; }
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const ACTIVES = D.skills.actives;                 // attack / spell / aura / curse / meta
const SUPPORTS = D.skills.supports;
const byId = Object.fromEntries([...ACTIVES, ...SUPPORTS].map(r => [r.id, r]));
const SOCKETS = 5;                                // the game gives each group five support sockets
$('libsub').textContent = `Game build ${D.build}. ${D.counts.actives} active runes, ${D.counts.supports} supports.`;

// ---------- compatibility: a support fits an active if every tag it `requires` is on the active ----------
function supportFits(active, sup) {
  if (!active) return false;
  const req = sup.requires || [];
  if (!req.length) return true;                   // 41 supports attach to anything
  const tags = new Set(active.tags || []);
  return req.every(t => tags.has(t));
}
function whyNot(active, sup) {
  const tags = new Set(active.tags || []);
  const missing = (sup.requires || []).filter(t => !tags.has(t));
  return missing.length ? 'needs ' + missing.join(', ') : '';
}
const r2 = v => Array.isArray(v) ? v.map(x => Math.round(x * 100) / 100).join('–') : (v ?? '');
const costText = c => Array.isArray(c) ? (c[0] === c[1] ? c[0] : `${c[0]}–${c[1]}`) : c;

// ---------- the loadout state ----------
// each group: { gem: activeId|null, supports: [id|null x5] }
let groups = [{ gem: null, supports: Array(SOCKETS).fill(null) }];

// ---------- rune library (left table) ----------
function libRows() {
  const q = $('q').value.trim().toLowerCase(), kind = $('kind').value, attr = $('attr').value;
  const sup = kind === 'support';
  const pool = sup ? SUPPORTS : ACTIVES;
  return pool.filter(s =>
    (kind === 'all' || sup || s.kind === kind) &&
    (attr === 'all' || s.attr === attr) &&
    (!q || [s.name, s.id, s.desc, s.rule, ...(s.tags || []), ...(s.requires || [])].join(' ').toLowerCase().includes(q)));
}
function renderLib() {
  const sup = $('kind').value === 'support';
  $('thead').innerHTML = sup
    ? '<tr><th>Support</th><th>Attr</th><th>Lvl</th><th>Needs</th><th>Mana</th><th>What it does</th><th></th></tr>'
    : '<tr><th>Rune</th><th>Kind</th><th>Attr</th><th>Lvl</th><th>Tags</th><th>Dmg</th><th>Cost</th><th>What it does</th><th></th></tr>';
  const rows = libRows();
  $('tbody').innerHTML = rows.map(s => sup
    ? `<tr><td class="n">${esc(s.name)}</td><td>${esc(s.attr||'')}</td><td>${s.level??''}</td><td class="t">${esc((s.requires||[]).join(', ')||'any')}</td><td>${s.manaMult?'×'+s.manaMult:''}</td><td class="t">${esc(s.desc||'')}</td><td><button class="add" data-add-support="${s.id}">Socket</button></td></tr>`
    : `<tr><td class="n">${esc(s.name)}</td><td><span class="kindtag ${s.kind}">${esc(s.kind)}</span></td><td>${esc(s.attr||'')}</td><td>${s.level??''}</td><td class="t">${esc((s.tags||[]).join(', '))}</td><td>${r2(s.dmg)}</td><td>${costText(s.cost)}</td><td class="t">${esc(s.desc||'')}${s.rule?`<div class="t">Fires: ${esc(s.rule)}</div>`:''}</td><td><button class="add" data-add-gem="${s.id}">Add</button></td></tr>`).join('')
    || '<tr><td colspan="9" class="t" style="padding:16px 20px">No runes match.</td></tr>';
  $('tbody').querySelectorAll('[data-add-gem]').forEach(b => b.onclick = () => addGroupWithGem(b.dataset.addGem));
  $('tbody').querySelectorAll('[data-add-support]').forEach(b => b.onclick = () => socketSupportFromLib(b.dataset.addSupport));
}

// ---------- loadout (right) ----------
function groupDmgLine(g) {
  const a = byId[g.gem]; if (!a) return '';
  const sups = g.supports.filter(Boolean).length;
  const bits = [a.kind];
  if (a.cost) bits.push(`${costText(a.cost)} mana`);
  if (sups) bits.push(`${sups} support${sups>1?'s':''}`);
  return bits.join(' · ');
}
function renderGroups() {
  $('loadhint').textContent = groups.some(g => g.gem)
    ? 'Click an empty socket to add a compatible support.'
    : 'Add an active rune from the list, or with the button below, to start a group.';
  $('groups').innerHTML = groups.map((g, gi) => {
    const a = byId[g.gem];
    const sockets = g.supports.map((sid, si) => {
      const s = byId[sid];
      if (s) return `<div class="socket full" title="${esc(s.desc||'')}"><span class="sx" data-rm="${gi}.${si}" title="Remove">×</span><span class="sn">${esc(s.name)}</span></div>`;
      return `<div class="socket empty" data-sock="${gi}.${si}" role="button" tabindex="0">+ support</div>`;
    }).join('');
    const meta = a && a.kind === 'meta';
    return `<div class="group${a?' filled':''}">
      <div class="top">
        <div class="gi">${a ? esc(a.name[0]) : '◇'}</div>
        <div class="gm">
          <div class="gn">${a ? esc(a.name) : '<span class="empty">Empty group</span>'}</div>
          <div class="gd">${a ? esc(groupDmgLine(g)) : 'Pick an active rune'}</div>
        </div>
        <button class="x" data-gem="${gi}" title="${a?'Change / clear rune':'Pick rune'}">${a?'×':'+'}</button>
      </div>
      ${a ? `<div class="sockets">${sockets}</div>` : ''}
      ${meta ? `<div class="reason">Meta rune — it <b>holds spells</b> socketed under it and triggers them (${esc(a.rule||'')}).</div>` : ''}
    </div>`;
  }).join('');
  $('groups').querySelectorAll('[data-gem]').forEach(b => b.onclick = () => { const gi=+b.dataset.gem; if (groups[gi].gem) { groups[gi].gem=null; groups[gi].supports=Array(SOCKETS).fill(null); renderGroups(); } else openGemPicker(gi); });
  $('groups').querySelectorAll('[data-sock]').forEach(el => { const go=()=>{const [gi,si]=el.dataset.sock.split('.').map(Number); openSupportPicker(gi,si);}; el.onclick=go; el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}}; });
  $('groups').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { const [gi,si]=b.dataset.rm.split('.').map(Number); groups[gi].supports[si]=null; renderGroups(); });
}
function addGroup() { groups.push({ gem: null, supports: Array(SOCKETS).fill(null) }); renderGroups(); }
function addGroupWithGem(id) {
  // fill the first empty group, else make a new one
  let g = groups.find(x => !x.gem);
  if (!g) { g = { gem: null, supports: Array(SOCKETS).fill(null) }; groups.push(g); }
  g.gem = id; g.supports = Array(SOCKETS).fill(null);
  renderGroups();
}
function socketSupportFromLib(id) {
  const sup = byId[id];
  // socket into the first group whose gem accepts it and has a free socket
  for (const g of groups) {
    const a = byId[g.gem];
    if (a && supportFits(a, sup) && g.supports.includes(null) && !g.supports.includes(id)) {
      g.supports[g.supports.indexOf(null)] = id; renderGroups(); return;
    }
  }
  // nothing fit — tell them softly by flashing the hint
  $('loadhint').textContent = `No group can take ${sup.name} yet — socket a compatible active rune first (it needs ${(sup.requires||['any']).join(', ')}).`;
}

// ---------- picker modal ----------
let pick = null; // { mode:'gem'|'support', gi, si }
function openGemPicker(gi) { pick = { mode: 'gem', gi }; $('picktitle').textContent = 'Pick an active rune'; $('pickq').value=''; $('picker').classList.add('on'); $('pickq').focus(); renderPick(); }
function openSupportPicker(gi, si) { pick = { mode: 'support', gi, si }; $('picktitle').textContent = 'Pick a support'; $('pickq').value=''; $('picker').classList.add('on'); $('pickq').focus(); renderPick(); }
function closePicker() { $('picker').classList.remove('on'); pick = null; }
function renderPick() {
  if (!pick) return;
  const q = $('pickq').value.trim().toLowerCase();
  const match = s => !q || [s.name, s.id, ...(s.tags||[]), ...(s.requires||[]), s.desc].join(' ').toLowerCase().includes(q);
  let html = '';
  if (pick.mode === 'gem') {
    html = ACTIVES.filter(match).map(a =>
      `<div class="row" data-id="${a.id}"><span class="rn">${esc(a.name)}</span><span class="rd"><span class="kindtag ${a.kind}">${esc(a.kind)}</span> · ${esc((a.tags||[]).join(', '))}</span></div>`).join('');
  } else {
    const a = byId[groups[pick.gi].gem];
    const already = new Set(groups[pick.gi].supports.filter(Boolean));
    // compatible first, then the rest shown as disabled with the reason
    const fit = SUPPORTS.filter(s => match(s) && supportFits(a, s) && !already.has(s.id));
    const no = SUPPORTS.filter(s => match(s) && (!supportFits(a, s)) && !already.has(s.id));
    html = fit.map(s => `<div class="row" data-id="${s.id}"><span class="rn">${esc(s.name)}</span><span class="rd">${esc(s.desc||'')}</span></div>`).join('')
      + no.map(s => `<div class="row no"><span class="rn">${esc(s.name)}</span><span class="rd">${esc(s.desc||'')}</span><span class="why">${esc(whyNot(a, s))}</span></div>`).join('');
    if (!fit.length && !no.length) html = '<div class="rd" style="padding:12px">No supports match.</div>';
  }
  $('plist').innerHTML = html || '<div class="rd" style="padding:12px">Nothing matches.</div>';
  $('plist').querySelectorAll('.row[data-id]').forEach(r => r.onclick = () => choose(r.dataset.id));
}
function choose(id) {
  if (pick.mode === 'gem') { groups[pick.gi].gem = id; groups[pick.gi].supports = Array(SOCKETS).fill(null); }
  else groups[pick.gi].supports[pick.si] = id;
  closePicker(); renderGroups();
}

// ---------- wire up ----------
['q','kind','attr'].forEach(id => $(id).addEventListener('input', renderLib));
$('kind').addEventListener('change', renderLib);
$('addgroup').onclick = addGroup;
$('pickclose').onclick = closePicker;
$('pickq').addEventListener('input', renderPick);
$('picker').addEventListener('click', e => { if (e.target === $('picker')) closePicker(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePicker(); });

renderLib(); renderGroups();
})();
</script>
</body>
</html>
