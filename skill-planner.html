<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hellruler skill planner</title>
<style>
  :root {
    --soot: #1b1512; --soot2: #15100e; --panel: #241c18; --panel2: #2d231e; --line: #3d302a;
    --bone: #efe3cf; --text: #e9dfd2; --muted: #a8978a; --ember: #e8a33d; --warn: #e0674f; --ok: #5c9a55;
    --str: #b8473b; --dex: #5c9a55; --int: #4c7cc0;
    --spell: #8a6bd0; --attack: #c86a3a; --fire: #e0674f; --cold: #4fa3c0; --lightning: #d7b23a; --chaos: #9b5fa8; --physical: #c9b8a6;
    --serif: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    --sans: "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--soot); color: var(--text); font: 14px/1.45 var(--sans);
    display: grid; grid-template-columns: 1fr 440px; grid-template-rows: 100%; overflow: hidden; }
  button:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--ember); outline-offset: 1px; }

  /* ---- left: rune library ---- */
  #lib { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  #lib header { padding: 14px 20px 10px; border-bottom: 1px solid var(--line); }
  h1 { font: 600 20px var(--serif); margin: 0 0 2px; color: var(--bone); }
  .sub { color: var(--muted); font-size: 12px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--soot); }
  .bar input, .bar select { background: var(--soot); color: var(--text); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; font: 14px var(--sans); }
  .bar input[type=search] { flex: 1; min-width: 180px; }
  .tablewrap { overflow: auto; flex: 1; min-height: 0; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--line); padding: 6px 8px 6px 20px; position: sticky; top: 0; background: var(--soot); z-index: 1; }
  td { border-bottom: 1px solid #2c221d; padding: 6px 8px; vertical-align: middle; }
  td:first-child { padding-left: 20px; }
  td.n { font: 600 14px var(--serif); color: var(--bone); white-space: nowrap; }
  td.t { color: var(--muted); font-size: 12px; }
  .ricon { width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); background: var(--soot); vertical-align: middle; object-fit: cover; }
  .kindtag { font-size: 11px; text-transform: capitalize; }
  .kindtag.attack { color: var(--attack); } .kindtag.spell { color: var(--spell); }
  .kindtag.aura { color: var(--ember); } .kindtag.curse { color: var(--chaos); } .kindtag.meta { color: var(--dex); } .kindtag.support { color: var(--muted); }
  .add { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 3px; padding: 3px 9px; font: 12px var(--sans); cursor: pointer; white-space: nowrap; }
  .add:hover { border-color: var(--ember); color: var(--bone); }

  /* ---- right: the in-game loadout ---- */
  aside { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  aside header { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .panebody { padding: 14px 16px 24px; overflow-y: auto; flex: 1; min-height: 0; }
  .section-label { font: 600 12px var(--sans); letter-spacing: 1.5px; color: var(--ember); text-transform: uppercase; margin: 2px 0 10px; }
  .section-label.worn { margin-top: 20px; }

  /* firing order: up to 3 active groups */
  .group { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 12px; background: linear-gradient(180deg, var(--panel2), var(--panel)); overflow: hidden; }
  .group.empty-slot { border-style: dashed; background: none; }
  .group .top { display: flex; align-items: center; gap: 10px; padding: 10px 12px; }
  .order { flex: none; width: 26px; height: 20px; border-radius: 4px; border: 1px solid var(--ember); color: var(--ember); font: 600 10px var(--sans); display: grid; place-items: center; }
  .gicon { flex: none; width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--line); background: var(--soot); display: grid; place-items: center; cursor: pointer; overflow: hidden; }
  .gicon img { width: 100%; height: 100%; object-fit: cover; }
  .gicon .plus { color: var(--muted); font-size: 22px; }
  .group.filled .gicon { border-color: var(--ember); }
  .gm { flex: 1; min-width: 0; }
  .gm .gn { font: 600 16px var(--serif); color: var(--bone); display: flex; align-items: center; gap: 8px; }
  .gm .meta { display: flex; align-items: center; gap: 6px; margin-top: 3px; flex-wrap: wrap; }
  .tag { font: 600 9.5px var(--sans); letter-spacing: 0.5px; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); }
  .tag.spell { color: var(--spell); border-color: #4a3a66; } .tag.attack { color: var(--attack); border-color: #5a3a2a; }
  .tag.fire { color: var(--fire); } .tag.cold { color: var(--cold); } .tag.lightning { color: var(--lightning); }
  .tag.chaos { color: var(--chaos); } .tag.physical { color: var(--physical); }
  .gm .lv { color: var(--muted); font-size: 12px; }
  .gm .empty { color: var(--muted); font-style: italic; font-weight: 400; }
  .gx { flex: none; background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 17px; padding: 2px 4px; }
  .gx:hover { color: var(--warn); }
  /* support sockets: a row of small circles under the active */
  .sockets { display: flex; gap: 8px; padding: 0 12px 12px 60px; }
  .socket { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); background: var(--soot); display: grid; place-items: center; cursor: pointer; position: relative; flex: none; }
  .socket.empty { border-style: dashed; color: var(--muted); font-size: 16px; }
  .socket.empty:hover { border-color: var(--ember); color: var(--ember); }
  .socket.full { border-color: #6a563f; overflow: hidden; }
  .socket.full img { width: 100%; height: 100%; object-fit: cover; }
  .socket.full .ini { font: 600 12px var(--serif); color: var(--bone); }
  .socket .rm { position: absolute; top: -6px; right: -6px; width: 15px; height: 15px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 10px; line-height: 13px; display: none; }
  .socket.full:hover .rm { display: block; color: var(--warn); border-color: var(--warn); }
  .meta-note { color: var(--muted); font-size: 11px; padding: 0 12px 12px 60px; }
  .meta-note b { color: var(--dex); }

  /* worn: aura/curse slots */
  .worn { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .wslot { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); background: var(--soot); display: grid; place-items: center; cursor: pointer; position: relative; flex: none; overflow: hidden; }
  .wslot.empty { border-style: dashed; color: var(--muted); font-size: 20px; }
  .wslot.empty:hover { border-color: var(--ember); color: var(--ember); }
  .wslot.full { border-color: var(--ember); }
  .wslot.full img { width: 100%; height: 100%; object-fit: cover; }
  .wslot .rm { position: absolute; top: -5px; right: -5px; width: 16px; height: 16px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 11px; line-height: 14px; display: none; }
  .wslot.full:hover .rm { display: block; color: var(--warn); border-color: var(--warn); }
  .reserve { color: var(--muted); font-size: 12px; margin-left: auto; }
  .reserve b { color: var(--bone); font-variant-numeric: tabular-nums; }
  .reserve.over b { color: var(--warn); }

  .tiptext { color: var(--muted); font-size: 12px; margin: 14px 0 0; border-top: 1px solid var(--line); padding-top: 12px; }
  .share { margin-top: 14px; }
  .share textarea { width: 100%; height: 56px; background: var(--soot); color: var(--text); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; font: 12px var(--sans); resize: vertical; }
  .share .btns { display: flex; gap: 6px; margin-top: 6px; }
  .share button { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 3px; padding: 5px 12px; font: 13px var(--sans); cursor: pointer; }
  .share button:hover { border-color: var(--ember); color: var(--bone); }

  /* ---- picker modal ---- */
  #picker { position: fixed; inset: 0; background: rgba(10,7,6,0.74); display: none; z-index: 20; align-items: center; justify-content: center; }
  #picker.on { display: flex; }
  .pick { width: min(600px, 94vw); max-height: 82vh; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; }
  .pick .ph { padding: 12px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
  .pick .ph b { font: 600 16px var(--serif); color: var(--bone); white-space: nowrap; }
  .pick .ph input { flex: 1; background: var(--soot); color: var(--text); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; font: 14px var(--sans); }
  .pick .ph .close { background: none; border: 0; color: var(--muted); font-size: 22px; cursor: pointer; }
  .pick .plist { overflow: auto; padding: 6px; }
  .pick .row { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 4px; cursor: pointer; }
  .pick .row:hover { background: var(--panel2); }
  .pick .row.no { opacity: 0.4; cursor: not-allowed; }
  .pick .row .rimg { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: var(--soot); flex: none; object-fit: cover; }
  .pick .row .rn { font: 600 14px var(--serif); color: var(--bone); flex: none; }
  .pick .row .rd { color: var(--muted); font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pick .row .why { color: var(--warn); font-size: 11px; flex: none; }

  @media (max-width: 920px) { body { grid-template-columns: 1fr; grid-template-rows: 46% 54%; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>

<section id="lib">
  <header>
    <h1>Hellruler skill planner</h1>
    <div class="sub" id="libsub"></div>
  </header>
  <div class="bar">
    <input type="search" id="q" placeholder="Search name, tag or text" aria-label="Search runes">
    <select id="kind" aria-label="Kind">
      <option value="all">Every kind</option>
      <option value="attack">Attacks</option><option value="spell">Spells</option>
      <option value="aura">Auras</option><option value="curse">Curses</option>
      <option value="meta">Meta</option><option value="support">Supports</option>
    </select>
    <select id="attr" aria-label="Attribute"><option value="all">Any attribute</option><option value="str">Strength</option><option value="dex">Dexterity</option><option value="int">Intelligence</option></select>
  </div>
  <div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
</section>

<aside>
  <header>
    <h1>Your build</h1>
    <div class="sub">Set it up like in game, then share</div>
  </header>
  <div class="panebody">
    <div class="section-label">Firing order</div>
    <div id="order"></div>

    <div class="section-label worn">Worn — auras &amp; curses</div>
    <div class="worn" id="worn"></div>

    <div class="share">
      <textarea id="share" readonly aria-label="Shareable build summary"></textarea>
      <div class="btns"><button id="copy">Copy build</button><button id="clear">Clear all</button></div>
    </div>
    <p class="tiptext">Three active skills, each with five support sockets, plus four worn aura/curse slots —
      the same shape as the game. Supports only socket where their tags fit the skill.</p>
  </div>
</aside>

<div id="picker" role="dialog" aria-modal="true" aria-label="Pick a rune">
  <div class="pick">
    <div class="ph"><b id="picktitle">Pick</b><input type="search" id="pickq" placeholder="Filter" aria-label="Filter runes"><button class="close" id="pickclose" aria-label="Close">×</button></div>
    <div class="plist" id="plist"></div>
  </div>
</div>

% lightning resistance","effect":{"res":"lightning","resAmt":30}},{"id":"laid_bare","name":"Laid Bare","tags":["aoe","duration"],"level":24,"desc":"−20% to all elemental resistances","effect":{"res":"all","resAmt":20}},{"id":"flayed","name":"Flayed","tags":["aoe","duration","physical"],"level":24,"desc":"+20% physical damage taken, +20% damage over time taken","effect":{"physTaken":20,"dotTaken":20}},{"id":"soulrot","name":"Soulrot","tags":["aoe","duration","chaos"],"level":24,"desc":"−20% chaos resistance, +15% damage over time taken","effect":{"res":"chaos","resAmt":20,"dotTaken":15}},{"id":"weaken","name":"Weaken","tags":["aoe","duration"],"level":24,"desc":"Enemies deal 20% less damage","effect":{"lessDmg":20}},{"id":"slow_hours","name":"Slow Hours","tags":["aoe","duration"],"level":24,"desc":"Enemies act 20% slower; ailments on them last 25% longer","effect":{"slow":20}},{"id":"killers_mark","name":"Killer's Mark","tags":["critical","mark"],"level":16,"desc":"The marked enemy takes critical strikes: +1.5% to the chance and +50% multiplier against it, and a Power Charge when it falls","effect":{"critAgainst":1.5,"critMultiAgainst":50,"chargeOnKill":"power"},"mark":true},{"id":"butchers_mark","name":"Butcher's Mark","tags":["mark"],"level":16,"desc":"Hits on the marked enemy leech 3% of the damage as life, and it leaves an Endurance Charge when it falls","effect":{"leechFrom":3,"chargeOnKill":"endurance"},"mark":true},{"id":"hunters_mark","name":"Hunter's Mark","tags":["physical","mark"],"level":16,"desc":"The marked enemy takes 25% more damage and leaves a Frenzy Charge when it falls","effect":{"taken":25,"chargeOnKill":"frenzy"},"mark":true},{"id":"marksmans_mark","name":"Marksman's Mark","tags":["mark"],"level":4,"desc":"The marked enemy takes 40% increased damage from projectiles","effect":{"projTaken":40},"mark":true},{"id":"brewers_mark","name":"Brewer's Mark","tags":["mark","aoe","duration","fire","chaos"],"level":24,"desc":"Everything rotting or burning o <script>
(() => {
'use strict';
const D = window.HR_SKILLS;
const GEMS = window.HR_GEMS || {};
if (!D) { document.body.textContent = 'Skill data not loaded.'; return; }
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const ACTIVES = D.skills.actives;                 // attack / spell / aura / curse / meta
const SUPPORTS = D.skills.supports;
const AURAS = [...D.skills.auras, ...D.skills.curses];   // the worn row holds auras and curses
const byId = Object.fromEntries([...ACTIVES, ...SUPPORTS, ...AURAS].map(r => [r.id, r]));
const SKILL_SLOTS = 3, SUPPORT_SOCKETS = 5, WORN_SLOTS = 4;   // the game's shape
$('libsub').textContent = `Game build ${D.build}. ${D.counts.actives} actives, ${D.counts.supports} supports, ${AURAS.length} auras & curses.`;

const gemSrc = id => GEMS[id] || '';
// an element tag to colour, if the skill carries one
const ELEM_TAGS = ['fire', 'cold', 'lightning', 'chaos', 'physical'];
function skillTags(a) {
  const out = [];
  if (a.kind === 'spell' || a.kind === 'attack' || a.kind === 'meta') out.push(a.kind === 'meta' ? 'meta' : a.kind);
  const el = ELEM_TAGS.find(t => (a.tags || []).includes(t));
  if (el) out.push(el);
  return out;
}

// ---------- compatibility ----------
function supportFits(active, sup) {
  if (!active) return false;
  const req = sup.requires || [];
  if (!req.length) return true;
  const tags = new Set(active.tags || []);
  return req.every(t => tags.has(t));
}
function whyNot(active, sup) {
  const tags = new Set(active.tags || []);
  const missing = (sup.requires || []).filter(t => !tags.has(t));
  return missing.length ? 'needs ' + missing.join(', ') : '';
}
const r2 = v => Array.isArray(v) ? v.map(x => Math.round(x * 100) / 100).join('–') : (v ?? '');
const costText = c => Array.isArray(c) ? (c[0] === c[1] ? c[0] : `${c[0]}–${c[1]}`) : c;

// ---------- loadout state (mirrors the game) ----------
const build = {
  groups: Array.from({ length: SKILL_SLOTS }, () => ({ gem: null, supports: Array(SUPPORT_SOCKETS).fill(null) })),
  worn: Array(WORN_SLOTS).fill(null),
};

// ---------- rune icon helper ----------
function iconHtml(id, cls) {
  const src = gemSrc(id); const r = byId[id];
  if (src) return `<img class="${cls}" src="${src}" alt="" loading="lazy">`;
  return `<span class="ini">${esc((r && r.name[0]) || '?')}</span>`;
}

// ---------- rune library (left table) ----------
function libRows() {
  const q = $('q').value.trim().toLowerCase(), kind = $('kind').value, attr = $('attr').value;
  const sup = kind === 'support';
  const pool = sup ? SUPPORTS : ACTIVES;
  return pool.filter(s =>
    (kind === 'all' || sup || s.kind === kind) &&
    (attr === 'all' || s.attr === attr) &&
    (!q || [s.name, s.id, s.desc, s.rule, ...(s.tags || []), ...(s.requires || [])].join(' ').toLowerCase().includes(q)));
}
function renderLib() {
  const sup = $('kind').value === 'support';
  $('thead').innerHTML = sup
    ? '<tr><th></th><th>Support</th><th>Attr</th><th>Lvl</th><th>Needs</th><th>Mana</th><th>What it does</th><th></th></tr>'
    : '<tr><th></th><th>Rune</th><th>Kind</th><th>Lvl</th><th>Tags</th><th>Dmg</th><th>Cost</th><th>What it does</th><th></th></tr>';
  const rows = libRows();
  $('tbody').innerHTML = rows.map(s => {
    const ic = gemSrc(s.id) ? `<img class="ricon" src="${gemSrc(s.id)}" alt="" loading="lazy">` : `<span class="ricon" style="display:inline-grid;place-items:center;font:600 12px serif;color:var(--bone)">${esc(s.name[0])}</span>`;
    const canWorn = s.kind === 'aura' || s.kind === 'curse';
    const addBtn = sup ? `<button class="add" data-add-support="${s.id}">Socket</button>`
      : canWorn ? `<button class="add" data-add-worn="${s.id}">Wear</button>`
      : `<button class="add" data-add-gem="${s.id}">Add</button>`;
    return sup
      ? `<tr><td>${ic}</td><td class="n">${esc(s.name)}</td><td>${esc(s.attr||'')}</td><td>${s.level??''}</td><td class="t">${esc((s.requires||[]).join(', ')||'any')}</td><td>${s.manaMult?'×'+s.manaMult:''}</td><td class="t">${esc(s.desc||'')}</td><td>${addBtn}</td></tr>`
      : `<tr><td>${ic}</td><td class="n">${esc(s.name)}</td><td><span class="kindtag ${s.kind}">${esc(s.kind)}</span></td><td>${s.level??''}</td><td class="t">${esc((s.tags||[]).join(', '))}</td><td>${r2(s.dmg)}</td><td>${costText(s.cost)}</td><td class="t">${esc(s.desc||'')}${s.rule?`<div class="t">Fires: ${esc(s.rule)}</div>`:''}</td><td>${addBtn}</td></tr>`;
  }).join('') || '<tr><td colspan="9" class="t" style="padding:16px 20px">No runes match.</td></tr>';
  $('tbody').querySelectorAll('[data-add-gem]').forEach(b => b.onclick = () => addGemToOrder(b.dataset.addGem));
  $('tbody').querySelectorAll('[data-add-support]').forEach(b => b.onclick = () => socketSupportAnywhere(b.dataset.addSupport));
  $('tbody').querySelectorAll('[data-add-worn]').forEach(b => b.onclick = () => wearAura(b.dataset.addWorn));
}

// ---------- the build (right side) ----------
function render() { renderOrder(); renderWorn(); renderShare(); }
function renderOrder() {
  $('order').innerHTML = build.groups.map((g, gi) => {
    const a = byId[g.gem];
    if (!a) {
      return `<div class="group empty-slot"><div class="top">
        <div class="order">${gi + 1}${['ST','ND','RD'][gi] || 'TH'}</div>
        <div class="gicon" data-gem="${gi}" role="button" tabindex="0" title="Pick an active skill"><span class="plus">+</span></div>
        <div class="gm"><div class="gn"><span class="empty">Empty skill slot</span></div><div class="lv">Pick an attack, spell or meta rune</div></div>
      </div></div>`;
    }
    const tags = skillTags(a).map(t => `<span class="tag ${t}">${esc(t)}</span>`).join('');
    const sockets = g.supports.map((sid, si) => {
      if (sid && byId[sid]) return `<div class="socket full" data-sock="${gi}.${si}" title="${esc(byId[sid].name)} — ${esc(byId[sid].desc||'')}">${iconHtml(sid,'')}<span class="rm" data-rm="${gi}.${si}">×</span></div>`;
      return `<div class="socket empty" data-sock="${gi}.${si}" role="button" tabindex="0" title="Add a support">+</div>`;
    }).join('');
    const meta = a.kind === 'meta';
    return `<div class="group filled"><div class="top">
        <div class="order">${gi + 1}${['ST','ND','RD'][gi] || 'TH'}</div>
        <div class="gicon" data-gem="${gi}" role="button" tabindex="0" title="Change skill">${iconHtml(a.id,'')}</div>
        <div class="gm">
          <div class="gn">${esc(a.name)}</div>
          <div class="meta">${tags}<span class="lv">Lv ${a.level ?? 1}</span></div>
        </div>
        <button class="gx" data-clear-gem="${gi}" title="Remove skill">×</button>
      </div>
      <div class="sockets">${sockets}</div>
      ${meta ? `<div class="meta-note"><b>Meta</b> — holds the spells socketed under it and triggers them (${esc(a.rule || '')}).</div>` : ''}
    </div>`;
  }).join('');
  $('order').querySelectorAll('[data-gem]').forEach(el => bindKeyClick(el, () => openGemPicker(+el.dataset.gem)));
  $('order').querySelectorAll('[data-clear-gem]').forEach(b => b.onclick = e => { e.stopPropagation(); const gi = +b.dataset.clearGem; build.groups[gi] = { gem: null, supports: Array(SUPPORT_SOCKETS).fill(null) }; render(); });
  $('order').querySelectorAll('.socket[data-sock]').forEach(el => bindKeyClick(el, () => { const [gi, si] = el.dataset.sock.split('.').map(Number); openSupportPicker(gi, si); }));
  $('order').querySelectorAll('[data-rm]').forEach(b => b.onclick = e => { e.stopPropagation(); const [gi, si] = b.dataset.rm.split('.').map(Number); build.groups[gi].supports[si] = null; render(); });
}
function renderWorn() {
  const used = build.worn.filter(Boolean).reduce((a, id) => a + (byId[id]?.reserve || 0), 0);
  $('worn').innerHTML = build.worn.map((id, wi) => {
    if (id && byId[id]) return `<div class="wslot full" data-worn="${wi}" role="button" tabindex="0" title="${esc(byId[id].name)} — ${esc(byId[id].desc||'')}">${iconHtml(id,'')}<span class="rm" data-rmworn="${wi}">×</span></div>`;
    return `<div class="wslot empty" data-worn="${wi}" role="button" tabindex="0" title="Wear an aura or curse">+</div>`;
  }).join('') + `<span class="reserve${used > 100 ? ' over' : ''}">reserves <b>${used}%</b> mana</span>`;
  $('worn').querySelectorAll('[data-worn]').forEach(el => bindKeyClick(el, () => openWornPicker(+el.dataset.worn)));
  $('worn').querySelectorAll('[data-rmworn]').forEach(b => b.onclick = e => { e.stopPropagation(); build.worn[+b.dataset.rmworn] = null; render(); });
}
function renderShare() {
  const groups = build.groups.filter(g => g.gem).map(g => ({ gem: g.gem, supports: g.supports.filter(Boolean) }));
  const worn = build.worn.filter(Boolean);
  $('share').value = (!groups.length && !worn.length) ? '' : JSON.stringify({ v: 1, groups, worn });
}
function bindKeyClick(el, fn) { el.onclick = fn; el.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fn(); } }; }

// ---------- quick-add from the library ----------
function addGemToOrder(id) {
  let g = build.groups.find(x => !x.gem);
  if (!g) g = build.groups[0];          // all full: replace the first
  g.gem = id; g.supports = Array(SUPPORT_SOCKETS).fill(null); render();
}
function socketSupportAnywhere(id) {
  const sup = byId[id];
  for (const g of build.groups) {
    const a = byId[g.gem];
    if (a && supportFits(a, sup) && g.supports.includes(null) && !g.supports.includes(id)) {
      g.supports[g.supports.indexOf(null)] = id; render(); return;
    }
  }
  flash(`No skill can take ${sup.name} yet — add a compatible active first (it needs ${(sup.requires||['any']).join(', ')}).`);
}
function wearAura(id) {
  if (build.worn.includes(id)) return;
  const slot = build.worn.indexOf(null);
  if (slot < 0) { flash('All four worn slots are full.'); return; }
  build.worn[slot] = id; render();
}
let flashTimer = null;
function flash(msg) { const el = $('share'); el.value = msg; clearTimeout(flashTimer); flashTimer = setTimeout(renderShare, 2600); }

// ---------- picker modal ----------
let pick = null; // { mode:'gem'|'support'|'worn', gi, si, wi }
function openGemPicker(gi) { pick = { mode: 'gem', gi }; openPicker('Pick an active skill'); }
function openSupportPicker(gi, si) { if (!byId[build.groups[gi].gem]) return openGemPicker(gi); pick = { mode: 'support', gi, si }; openPicker('Pick a support'); }
function openWornPicker(wi) { pick = { mode: 'worn', wi }; openPicker('Pick an aura or curse'); }
function openPicker(title) { $('picktitle').textContent = title; $('pickq').value = ''; $('picker').classList.add('on'); $('pickq').focus(); renderPick(); }
function closePicker() { $('picker').classList.remove('on'); pick = null; }
function renderPick() {
  if (!pick) return;
  const q = $('pickq').value.trim().toLowerCase();
  const match = s => !q || [s.name, s.id, ...(s.tags || []), ...(s.requires || []), s.desc].join(' ').toLowerCase().includes(q);
  const img = id => gemSrc(id) ? `<img class="rimg" src="${gemSrc(id)}" alt="" loading="lazy">` : `<span class="rimg" style="display:inline-grid;place-items:center;font:600 13px serif;color:var(--bone)">${esc((byId[id]?.name||'?')[0])}</span>`;
  let html = '';
  if (pick.mode === 'gem') {
    html = ACTIVES.filter(a => a.kind !== 'aura' && a.kind !== 'curse').filter(match).map(a =>
      `<div class="row" data-id="${a.id}">${img(a.id)}<span class="rn">${esc(a.name)}</span><span class="rd"><span class="kindtag ${a.kind}">${esc(a.kind)}</span> · ${esc((a.tags||[]).join(', '))}</span></div>`).join('');
  } else if (pick.mode === 'worn') {
    const worn = new Set(build.worn.filter(Boolean));
    html = AURAS.filter(match).map(a =>
      `<div class="row${worn.has(a.id) ? ' no' : ''}" ${worn.has(a.id) ? '' : `data-id="${a.id}"`}>${img(a.id)}<span class="rn">${esc(a.name)}</span><span class="rd">${esc(a.desc||'')}</span>${a.reserve ? `<span class="why" style="color:var(--muted)">${a.reserve}%</span>` : ''}</div>`).join('');
  } else {
    const a = byId[build.groups[pick.gi].gem];
    const already = new Set(build.groups[pick.gi].supports.filter(Boolean));
    const fit = SUPPORTS.filter(s => match(s) && supportFits(a, s) && !already.has(s.id));
    const no = SUPPORTS.filter(s => match(s) && !supportFits(a, s) && !already.has(s.id));
    html = fit.map(s => `<div class="row" data-id="${s.id}">${img(s.id)}<span class="rn">${esc(s.name)}</span><span class="rd">${esc(s.desc||'')}</span></div>`).join('')
      + no.map(s => `<div class="row no">${img(s.id)}<span class="rn">${esc(s.name)}</span><span class="rd">${esc(s.desc||'')}</span><span class="why">${esc(whyNot(a, s))}</span></div>`).join('');
  }
  $('plist').innerHTML = html || '<div class="rd" style="padding:12px">Nothing matches.</div>';
  $('plist').querySelectorAll('.row[data-id]').forEach(r => r.onclick = () => choose(r.dataset.id));
}
function choose(id) {
  if (pick.mode === 'gem') { const g = build.groups[pick.gi]; g.gem = id; g.supports = Array(SUPPORT_SOCKETS).fill(null); }
  else if (pick.mode === 'worn') { if (!build.worn.includes(id)) build.worn[pick.wi] = id; }
  else build.groups[pick.gi].supports[pick.si] = id;
  closePicker(); render();
}

// ---------- wire up ----------
['q', 'kind', 'attr'].forEach(id => $(id).addEventListener('input', renderLib));
$('kind').addEventListener('change', renderLib);
$('pickclose').onclick = closePicker;
$('pickq').addEventListener('input', renderPick);
$('picker').addEventListener('click', e => { if (e.target === $('picker')) closePicker(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePicker(); });
$('copy').onclick = () => { if (!$('share').value) return; $('share').select(); navigator.clipboard?.writeText($('share').value); };
$('clear').onclick = () => { build.groups = Array.from({ length: SKILL_SLOTS }, () => ({ gem: null, supports: Array(SUPPORT_SOCKETS).fill(null) })); build.worn = Array(WORN_SLOTS).fill(null); render(); };

renderLib(); render();
})();
</script>
</body>
</html>
