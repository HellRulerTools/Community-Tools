<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hellruler prestige planner</title>
<style>
  :root {
    --soot: #1b1512; --panel: #241c18; --panel2: #2d231e; --line: #3d302a;
    --bone: #efe3cf; --text: #e9dfd2; --muted: #a8978a; --ember: #e8a33d; --warn: #e0674f;
    --str: #b8473b; --dex: #5c9a55; --int: #4c7cc0; --sd: #a8803a; --si: #9b5fa8;
    --serif: "Palatino Linotype", "Book Antiqua", Palatino, Georgia, serif;
    --sans: "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--soot); color: var(--text); font: 14px/1.45 var(--sans); overflow: hidden; }
  body { display: grid; grid-template-columns: 1fr 360px; }
  canvas:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--ember); outline-offset: 1px; }
  #stage { position: relative; overflow: hidden; }
  canvas#cv { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas#cv.drag { cursor: grabbing; }
  #tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--ember); padding: 8px 10px; max-width: 300px; font-size: 13px; display: none; z-index: 2; }
  #tip b { font: 600 15px var(--serif); color: var(--bone); display: block; } #tip .cost { color: var(--ember); } #tip .k { color: var(--muted); font-size: 12px; }
  aside { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 14px 16px 30px; }
  h1 { font: 600 20px var(--serif); margin: 0 0 2px; color: var(--bone); } .sub { color: var(--muted); font-size: 12px; }
  h2 { font: 600 15px var(--serif); color: var(--bone); margin: 18px 0 6px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  label { display: block; color: var(--muted); font-size: 12px; margin: 10px 0 4px; }
  input[type=number] { width: 100%; background: var(--soot); color: var(--text); border: 1px solid var(--line); border-radius: 3px; padding: 6px 8px; font: 14px var(--sans); }
  .budget { font: 600 24px var(--serif); color: var(--bone); margin-top: 12px; font-variant-numeric: tabular-nums; } .budget small { font: 13px var(--sans); color: var(--muted); } .budget.over { color: var(--warn); }
  .btns { display: flex; gap: 6px; margin-top: 10px; } button.b { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 3px; padding: 6px 10px; font: 13px var(--sans); cursor: pointer; } button.b:hover { border-color: var(--ember); color: var(--bone); }
  ul.stats { list-style: none; padding: 0; margin: 0; } ul.stats li { padding: 2px 0; }
  .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
  @media (max-width: 900px) { body { grid-template-columns: 1fr; grid-template-rows: 62% 38%; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<main id="stage">
  <canvas id="cv" tabindex="0" aria-label="Prestige tree. Drag to move, scroll or pinch to zoom, tap a step to buy it."></canvas>
  <div id="tip" role="tooltip"></div>
</main>
<aside>
  <h1>Prestige planner</h1>
  <div class="sub" id="binfo"></div>
  <label for="ppts">Prestige points</label>
  <input type="number" id="ppts" min="0" max="5000" value="0">
  <div class="budget" id="prbudget" aria-live="polite"></div>
  <div class="btns"><button class="b" id="clearpr">Clear</button></div>
  <h2>What your steps give</h2>
  <ul class="stats" id="prtotals"></ul>
  <h2>Points by depth</h2>
  <label for="pdepth">Depth cleared</label>
  <input type="number" id="pdepth" min="0" value="10000">
  <div class="budget" id="pdpays"></div>
  <p class="note" id="prules"></p>
</aside>

6,"pays":50},{"depth":8787,"pays":51},{"depth":8877,"pays":52},{"depth":8966,"pays":53},{"depth":9055,"pays":54},{"depth":9144,"pays":55},{"depth":9232,"pays":56},{"depth":9319,"pays":57},{"depth":9406,"pays":58},{"depth":9492,"pays":59},{"depth":9578,"pays":60},{"depth":9664,"pays":61},{"depth":9749,"pays":62},{"depth":9833,"pays":63},{"depth":9917,"pays":64},{"depth":10000,"pays":65},{"depth":10084,"pays":66},{"depth":10166,"pays":67},{"depth":10249,"pays":68},{"depth":10330,"pays":69},{"depth":10412,"pays":70},{"depth":10493,"pays":71},{"depth":10574,"pays":72},{"depth":10654,"pays":73},{"depth":10734,"pays":74},{"depth":10814,"pays":75},{"depth":10893,"pays":76},{"depth":10972,"pays":77},{"depth":11050,"pays":78},{"depth":11128,"pays":79},{"depth":11206,"pays":80},{"depth":11284,"pays":81},{"depth":11361,"pays":82},{"depth":11438,"pays":83},{"depth":11514,"pays":84},{"depth":11591,"pays":85},{"depth":11667,"pays":86},{"depth":11742,"pays":87},{"depth":11818,"pays":88},{"depth":11893,"pays":89},{"depth":11967,"pays":90},{"depth":12042,"pays":91},{"depth":12116,"pays":92},{"depth":12190,"pays":93},{"depth":12264,"pays":94},{"depth":12337,"pays":95},{"depth":12411,"pays":96},{"depth":12483,"pays":97},{"depth":12556,"pays":98},{"depth":12629,"pays":99},{"depth":12701,"pays":100},{"depth":12773,"pays":101},{"depth":12844,"pays":102},{"depth":12916,"pays":103},{"depth":12987,"pays":104},{"depth":13058,"pays":105},{"depth":13129,"pays":106},{"depth":13199,"pays":107},{"depth":13270,"pays":108},{"depth":13340,"pays":109},{"depth":13410,"pays":110},{"depth":13479,"pays":111},{"depth":13549,"pays":112},{"depth":13618,"pays":113},{"depth":13687,"pays":114},{"depth":13756,"pays":115},{"depth":13825,"pays":116},{"depth":13893,"pays":117},{"depth":13961,"pays":118},{"depth":14029,"pays":119},{"depth":14097,"pays":120}]},"rules":{"passive":["Every node costs 1 point (the engine's cost function returns 1 for all nodes in this build).","You get 1 point per hero level. Level is capped at 30; each Ascent rank in the Prestige tree raises the cap by 10, to 100 at 7 ranks.","A node can be taken if it links to a node you hold. Giving a node back also gives back every node that depended on it.","Masteries (round nodes): once you hold a large node beside one, pick one of its bonuses. It costs 1 point; switching the pick is free.","Keystones change a rule of the fight, not a number.","Each start is a fixed node; paths never run through another start."],"prestige":["A prestige opens once your run has cleared depth 2000. It restarts the run and pays prestige points for the depth cleared, each point sooner than the last. The same depth pays again on another run.","Prestige points buy steps in the Prestige tree. Step k of a chain costs 2k - 1 points. Its steps stay through every prestige.","A prestige resets your level, the main tree's points, depth, gear and bag, runes and their experience (except Kept ones), souls and unopened loot. The passive tree stays as a plan of ghost nodes to re-take as points return.","It keeps the Prestige tree, your start and path, pets, titles and Plus."]},"current":null};</script>
<script>
(() => {
'use strict';
const D = window.HR_PRESTIGE;
if (!D) { document.body.textContent = 'Prestige data not loaded.'; return; }
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const css = getComputedStyle(document.documentElement), col = v => css.getPropertyValue(v).trim();
const COLORS = { str: col('--str'), dex: col('--dex'), int: col('--int'), sd: col('--sd'), si: col('--si') };
const BONE = col('--bone'), EMBER = col('--ember'), LINE = col('--line'), MUTED = col('--muted'), SOOT = col('--soot');
$('binfo').textContent = `Game build ${D.build} · ${D.prestige.nodes.length} steps across ${D.prestige.chains.length} chains`;

const PNODES = Object.fromEntries(D.prestige.nodes.map(n => [n.id, n]));
const prLinks = id => { const n = PNODES[id]; const back = D.prestige.nodes.filter(m => m.links.includes(id)).map(m => m.id); return [...new Set([...n.links, ...back])]; };
const PR = { held: new Set() };
const canBuy = id => !PR.held.has(id) && (PNODES[id].coreLinked || prLinks(id).some(x => PR.held.has(x)));
function prGiveBack(id) { if (id) PR.held.delete(id); const seen = new Set(), q = [...PR.held].filter(x => PNODES[x].coreLinked); q.forEach(x => seen.add(x)); while (q.length) { const c = q.shift(); for (const n of prLinks(c)) if (PR.held.has(n) && !seen.has(n)) { seen.add(n); q.push(n); } } for (const h of [...PR.held]) if (!seen.has(h)) PR.held.delete(h); }

const cv = $('cv'), ctx = cv.getContext('2d'), tip = $('tip');
let view = { x: 0, y: 0, s: 0.5 }, hover = null;
function resize() { const r = cv.getBoundingClientRect(), d = devicePixelRatio || 1; cv.width = r.width * d; cv.height = r.height * d; ctx.setTransform(d, 0, 0, d, 0, 0); draw(); }
const toScreen = (x, y) => [(x - view.x) * view.s + cv.clientWidth / 2, (y - view.y) * view.s + cv.clientHeight / 2];
const toWorld = (sx, sy) => [(sx - cv.clientWidth / 2) / view.s + view.x, (sy - cv.clientHeight / 2) / view.s + view.y];
function fit(pts) { const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]); const [x0, x1, y0, y1] = [Math.min(...xs), Math.max(...xs), Math.min(...ys), Math.max(...ys)]; view.x = (x0 + x1) / 2; view.y = (y0 + y1) / 2; view.s = Math.min(cv.clientWidth / (x1 - x0 + 200), cv.clientHeight / (y1 - y0 + 200)); }
function draw() {
  ctx.clearRect(0, 0, cv.clientWidth, cv.clientHeight);
  const ok = id => PR.held.has(id);
  for (const n of D.prestige.nodes) for (const b of n.links) { const B = PNODES[b]; if (!B) continue; const [x1, y1] = toScreen(n.x, n.y), [x2, y2] = toScreen(B.x, B.y); ctx.strokeStyle = ok(n.id) && ok(b) ? BONE : LINE; ctx.lineWidth = ok(n.id) && ok(b) ? 2.5 : 1.2; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
  const gcol = { might: COLORS.str, ascent: COLORS.int, legacy: COLORS.sd, spoils: COLORS.dex, ring: COLORS.si };
  ctx.textAlign = 'center';
  for (const n of D.prestige.nodes) { const [x, y] = toScreen(n.x, n.y); const r = Math.max(4, (n.shape === 'notable' ? 15 : n.shape === 'begin' ? 13 : 10) * view.s); const c = gcol[n.group] || MUTED; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fillStyle = ok(n.id) ? c : hover === n.id && canBuy(n.id) ? EMBER : SOOT; ctx.fill(); ctx.strokeStyle = ok(n.id) ? BONE : c; ctx.lineWidth = 2; ctx.stroke(); if (view.s > 0.55 && (n.step === 1 || view.s > 1.6)) { ctx.font = '11px "Segoe UI", sans-serif'; ctx.fillStyle = MUTED; ctx.fillText(n.step === 1 ? n.chainName : n.name, x, y + r + 12); } if (view.s > 0.4) { ctx.font = '600 11px "Segoe UI", sans-serif'; ctx.fillStyle = ok(n.id) ? SOOT : BONE; ctx.fillText(String(n.cost), x, y + 4); } }
}
function nodeAt(sx, sy) { let best = null, bd = Infinity; for (const n of D.prestige.nodes) { const [x, y] = toScreen(n.x, n.y), d = (x - sx) ** 2 + (y - sy) ** 2; if (d < bd) { bd = d; best = n.id; } } const floor = matchMedia('(pointer: coarse)').matches ? 24 : 12; const lim = Math.max(floor, 18 * view.s); return bd <= lim * lim ? best : null; }
function showTip(id, sx, sy) { if (!id) { tip.style.display = 'none'; return; } const n = PNODES[id], c = D.prestige.chains.find(x => x.id === n.chain); let h = `<b>${esc(n.name)}</b><span class="k">${esc(n.group)} chain, step ${n.step} of ${c ? c.ranks : '?'}</span><div>${esc(c ? c.per : '')}</div>` + (c && c.byRank[n.step - 1] ? `<div class="k">At this step: ${esc(c.byRank[n.step - 1])}</div>` : '') + `<div class="cost">${PR.held.has(id) ? 'Held. Tap to give it back.' : canBuy(id) ? `Costs ${n.cost} point${n.cost > 1 ? 's' : ''}. Tap to buy.` : `Costs ${n.cost}. Needs a linked step first.`}</div>`; tip.innerHTML = h; tip.style.display = 'block'; const r = cv.getBoundingClientRect(); tip.style.left = Math.min(sx + 16, r.width - 310) + 'px'; tip.style.top = Math.min(sy + 16, r.height - tip.offsetHeight - 10) + 'px'; }
function prChanged() {
  const spent = [...PR.held].reduce((a, id) => a + PNODES[id].cost, 0), have = +$('ppts').value || 0;
  $('prbudget').className = 'budget' + (spent > have ? ' over' : '');
  $('prbudget').innerHTML = `${spent} <small>of ${have} prestige points${spent > have ? `, ${spent - have} over` : ''}</small>`;
  const byChain = {}; for (const id of PR.held) { const n = PNODES[id]; byChain[n.chain] = Math.max(byChain[n.chain] || 0, n.step); }
  $('prtotals').innerHTML = Object.entries(byChain).map(([c, r]) => { const ch = D.prestige.chains.find(x => x.id === c); return `<li>${esc(ch.name)}: ${esc(ch.byRank[r - 1] || `rank ${r}`)}</li>`; }).join('') || '<li class="note">No steps bought yet. Tap a step on the map.</li>';
  draw();
}
// input (mouse + touch + pinch)
const pts = new Map(); let drag = null, moved = false, pinch = null;
const dragThresh = e => e.pointerType === 'touch' ? 10 : 4;
function applyZoom(f, sx, sy) { const [wx, wy] = toWorld(sx, sy); view.s = Math.min(3, Math.max(0.08, view.s * f)); view.x = wx - (sx - cv.clientWidth / 2) / view.s; view.y = wy - (sy - cv.clientHeight / 2) / view.s; }
cv.addEventListener('pointerdown', e => { cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (pts.size === 2) { const [a, b] = [...pts.values()]; const r = cv.getBoundingClientRect(); pinch = { dist: Math.hypot(a.x - b.x, a.y - b.y) }; drag = null; moved = true; tip.style.display = 'none'; } else { drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; moved = false; } });
cv.addEventListener('pointermove', e => { const r = cv.getBoundingClientRect(), sx = e.clientX - r.left, sy = e.clientY - r.top; if (pts.has(e.pointerId)) pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (pinch && pts.size >= 2) { const [a, b] = [...pts.values()]; const dist = Math.hypot(a.x - b.x, a.y - b.y); const cx = (a.x + b.x) / 2 - r.left, cy = (a.y + b.y) / 2 - r.top; if (pinch.dist > 0) applyZoom(dist / pinch.dist, cx, cy); pinch.dist = dist; draw(); return; } if (drag) { const dx = e.clientX - drag.x, dy = e.clientY - drag.y; if (Math.abs(dx) + Math.abs(dy) > dragThresh(e)) { moved = true; cv.classList.add('drag'); } if (moved) { view.x = drag.vx - dx / view.s; view.y = drag.vy - dy / view.s; tip.style.display = 'none'; draw(); return; } } if (e.pointerType !== 'touch') { const id = nodeAt(sx, sy); if (id !== hover) { hover = id; draw(); } showTip(id, sx, sy); } });
function endPointer(e) { const r = cv.getBoundingClientRect(), sx = e.clientX - r.left, sy = e.clientY - r.top; const wasDrag = moved, wasPinch = !!pinch; pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (pts.size > 0) return; cv.classList.remove('drag'); drag = null; if (wasDrag || wasPinch) { moved = false; return; } const id = nodeAt(sx, sy); if (!id) return; hover = id; if (PR.held.has(id)) prGiveBack(id); else if (canBuy(id)) PR.held.add(id); prChanged(); showTip(id, sx, sy); }
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', e => { pts.delete(e.pointerId); if (pts.size < 2) pinch = null; if (!pts.size) { drag = null; cv.classList.remove('drag'); } });
cv.addEventListener('pointerleave', e => { if (e.pointerType !== 'touch') { hover = null; tip.style.display = 'none'; draw(); } });
cv.addEventListener('wheel', e => { e.preventDefault(); const r = cv.getBoundingClientRect(); applyZoom(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - r.left, e.clientY - r.top); draw(); }, { passive: false });
// depth -> points, the game's own formula
function pays(d) { d = Math.floor(Math.max(0, d)); if (d < D.prestige.opensAtDepth) return 0; const n = BigInt(d - D.prestige.opensAtDepth), sc = 500n, v = n * n * n / (sc * sc * sc); let t = BigInt(Math.floor(Math.sqrt(Number(v)))); while (t * t > v) t--; while ((t + 1n) * (t + 1n) <= v) t++; return 1 + Number(t); }
$('ppts').oninput = prChanged;
$('clearpr').onclick = () => { PR.held.clear(); prChanged(); };
$('pdepth').oninput = () => { $('pdpays').innerHTML = `${pays(+$('pdepth').value)} <small>prestige points for that run</small>`; };
$('prules').textContent = (D.rules.prestige || []).join(' ');
window.addEventListener('resize', resize);
if (D.current) { $('ppts').value = D.current.prestigeNowPays || 0; $('pdepth').value = D.current.depth || 10000; }
$('pdepth').oninput();
resize(); fit(D.prestige.nodes.map(n => [n.x, n.y])); prChanged();
})();
</script>
</body>
